[build]
    command = "npm run build"
    publish = "dist"

[functions]
    directory = "lambda"
    node_bundler = "esbuild"

[build.environment]
    NODE_VERSION = "22.20.0"

# Temporarily disabled to test Node.js version issue
# [[plugins]]
#     package = "./plugins/webmention-cache"

[[headers]]
    for = "/*"
    [headers.values]
        X-Frame-Options = "DENY"
        X-Content-Type-Options = "nosniff"
        Referrer-Policy = "strict-origin-when-cross-origin"
        Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
        Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://platform.twitter.com https://cdn.syndication.twimg.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://webmention.io https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com; frame-src https://platform.twitter.com https://syndication.twitter.com; media-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"

[[headers]]
  for = "/sw.js"
  [headers.values]
    cache-control = "max-age=0,no-cache,no-store,must-revalidate"

# Netlify subdomain
[[redirects]]
    from = "https://filippovicentini.netlify.com/*"
    to = "https://filippovicentini.com/:splat"
    status = 301
    force = true

# Bots
[[redirects]]
    from = "/wp-login.php"
    to = "https://www.google.com/"
    status = 302
    force = true

# Favicon
[[redirects]]
    from = "/assets/images/touch/*"
    to = "/assets/images/favicon/:splat"
    status = 301
    force = true

# 404s
[[redirects]]
    from = "*"
    to = "/404"
    status = 404
